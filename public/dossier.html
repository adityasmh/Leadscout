<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Dossier | Leadscout</title>

    :root {
      --bg: #ffffff;
      --fg: #111827;
      --panel-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --focus: #f59e0b;
      --error-bg: #fee2e2;
      --error-fg: #991b1b;
      --muted: #6b7280;
      --success-bg: #dcfce7;
      --success-fg: #14532d;
      --badge-bg: #e0e7ff;
      --badge-fg: #3730a3;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --panel-bg: #1e293b;
        --card-bg: #1e293b;
        --border: #334155;
        --accent: #60a5fa;
        --accent-text: #0f172a;
        --focus: #fbbf24;
        --error-bg: #450a0a;
        --error-fg: #fecaca;
        --muted: #94a3b8;
        --badge-bg: #312e81;
        --badge-fg: #c7d2fe;
        --success-bg: #064e3b;
        --success-fg: #bbf7d0;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.55;
      padding: 1rem;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .hidden { display: none !important; }
    a { color: var(--accent); }
    a:hover, a:focus { text-decoration: underline; }
    button, select, input {
      font: inherit;
      color: inherit;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
    }
    button {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 500;
    }
    button.secondary { background: var(--card-bg); color: var(--fg); border-color: var(--border); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    select { width: 100%; max-width: 24rem; }
    .container { max-width: 800px; margin: 0 auto; }
    .report-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      background: var(--panel-bg);
      flex-wrap: wrap;
    }

    .report-header .brand-name { font-size: 1.25rem; font-weight: 700; }
    .report-header .brand-contact { font-size: 0.875rem; color: var(--muted); }
    .report-list { margin-bottom: 1rem; }
    .report-list h2 { font-size: 1rem; margin: 0 0 0.5rem; }
    .report-item {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      background: var(--card-bg);
    }
    .report-item:hover, .report-item:focus-within { border-color: var(--accent); }
    .report-item h3 { font-size: 1rem; margin: 0 0 0.25rem; }
    .report-item .tag { display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 0.125rem 0.5rem; border-radius: 999px; background: var(--badge-bg); color: var(--badge-fg); margin-right: 0.5rem; }
    .report-item .headline { color: var(--muted); font-size: 0.875rem; }
    section {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1rem;
      background: var(--card-bg);
    }
    h1, h2, h3, h4 { margin: 0 0 0.5rem; line-height: 1.3; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.125rem; }
    h3 { font-size: 1rem; }
    .identity h1 { margin-bottom: 0.25rem; }
    .meta { color: var(--muted); font-size: 0.9375rem; margin-bottom: 0.75rem; }
    .contacts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .contacts a {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.375rem 0.625rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      text-decoration: none;
      font-size: 0.875rem;
      background: var(--panel-bg);
      color: var(--fg);
    }
    .facts { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
    .fact { font-size: 0.9375rem; }
    .fact-label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .score-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .score-box { text-align: center; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel-bg); }
    .score-box .number { font-size: 1.5rem; font-weight: 700; }
    .score-box .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .reasons { margin: 0.75rem 0 0; padding-left: 1.25rem; font-size: 0.9375rem; color: var(--muted); }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-fg);
    }
    .copy-row { display: flex; gap: 0.5rem; align-items: start; }
    .copy-row blockquote, .copy-row pre {
      flex: 1;
      margin: 0;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      background: var(--panel-bg);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 0.9375rem;
    }
    .copy-feedback { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; }
    .offer { border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
    .offer:last-child { margin-bottom: 0; }
    .offer-header { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .offer-header h3 { margin: 0; }
    .offer .label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
    .offer .free { background: var(--success-bg); color: var(--success-fg); padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .price-not-set { font-style: italic; color: var(--muted); }
    .works-banner {
      font-size: 0.875rem;
      color: var(--muted);
      border-left: 3px solid var(--border);
      padding-left: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .works-list { margin: 0; padding-left: 1.25rem; }
    .works-list li { margin-bottom: 0.375rem; }
    .evidence-list { list-style: none; padding: 0; margin: 0; }
    .evidence-list li { border-bottom: 1px solid var(--border); padding: 0.75rem 0; }
    .evidence-list li:last-child { border-bottom: none; }
    .evidence-list .num { font-weight: 700; min-width: 2rem; display: inline-block; }
    .evidence-list .kind { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
    .evidence-list .quote { margin: 0.25rem 0; word-break: break-word; }
    .evidence-list .source { font-size: 0.875rem; }
    .evidence-list .fetched { font-size: 0.75rem; color: var(--muted); }
    .evidence-refs { font-size: 0.875rem; margin-left: 0.25rem; }
    .evidence-refs a { margin-left: 0.25rem; }
    .status-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .status-row .saved { font-size: 0.875rem; color: var(--muted); }
    .generate-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .note { padding: 0.75rem; border-radius: 0.375rem; background: var(--success-bg); color: var(--success-fg); margin-top: 0.75rem; }
    .level { font-size: 0.875rem; color: var(--muted); }
    details { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 1rem; background: var(--card-bg); }
    summary { cursor: pointer; font-weight: 600; }
    .dropped-list { margin: 0.5rem 0 0; padding-left: 1.25rem; font-size: 0.9375rem; }
    footer {
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
      padding: 1rem;
      border-top: 1px solid var(--border);
      margin-top: 1rem;

    #id-error {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: var(--error-bg);
      color: var(--error-fg);
      z-index: 30;
    }
    #id-error:empty { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    @media (max-width: 600px) {
      body { padding: 0.75rem; }
      .score-grid { grid-template-columns: 1fr; }
      .copy-row { flex-direction: column; }
      .copy-row blockquote, .copy-row pre { width: 100%; }
    }
    @media print {
      body { padding: 0; background: #fff; color: #000; }
      section, details, .report-header, .report-item { break-inside: avoid; }
      #id-error, .report-list, #id-generate, #id-callstatus { display: none !important; }
      a { text-decoration: none; color: #000; }
      .contacts a { border: 1px solid #999; }
    }
  </style>
</head>

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "className") node.className = v;
          else if (k === "textContent") node.textContent = v;
          else if (v != null) node.setAttribute(k, v);
        }
      }
      if (children) {
        for (const c of children) {
          if (c == null) continue;
          if (c.nodeType) node.appendChild(c);
          else node.appendChild(document.createTextNode(String(c)));
        }
      }
      return node;
    }

    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function setVisible(node, visible) {
      node.classList.toggle("hidden", !visible);
    }

    function normalizeUrl(raw) {
      const s = String(raw == null ? "" : raw).trim();
      if (!s) return "";
      if (/^https?:\/\//i.test(s)) return s;
      return "https://" + s;
    }

    // UI1-shared-start: one workspace-selection rule shared by index.html, settings.html and dossier.html.
    function workspaceChoiceKey() { return "leadscout.workspace"; }
    function wsStored(key) {
      try { return localStorage.getItem(key || workspaceChoiceKey()) || ""; } catch (e) { return ""; }
    }
    function wsRemember(id, key) {
      try { localStorage.setItem(key || workspaceChoiceKey(), String(id || "")); } catch (e) {}
    }
    function pickWorkspaceId(paramWs, stored, list) {
      if (paramWs) return String(paramWs);
      if (stored) return String(stored);
      var arr = Array.isArray(list) ? list.slice() : [];
      if (!arr.length) return "";
      function countOf(w) {
        var cand = [w && w.leadsCount, w && w.leadCount, w && w.total];
        for (var i = 0; i < cand.length; i++) { if (typeof cand[i] === "number") return cand[i]; }
        return null;
      }
      function newest(pool) {
        var best = pool[pool.length - 1];
        for (var i = 0; i < pool.length; i++) {
          var t = pool[i] && pool[i].createdAt ? String(pool[i].createdAt) : "";
          var bt = best && best.createdAt ? String(best.createdAt) : "";
          if (t && (!bt || t > bt)) best = pool[i];
        }
        return best;
      }
      var countsKnown = arr.some(function (w) { return countOf(w) != null; });
      if (countsKnown) {
        var withLeads = arr.filter(function (w) { var c = countOf(w); return typeof c === "number" && c >= 1; });
        if (withLeads.length) return String(newest(withLeads).id);
      }
      var nonDemo = arr.filter(function (w) { return String((w && w.name) || "").trim().toLowerCase() !== "demo"; });
      var pool = nonDemo.length ? nonDemo : arr;
      var picked = newest(pool);
      return picked ? String(picked.id) : "";
    }

    function evidenceAnchor(num) {
      const a = el("a", { href: "#ev-" + num, "aria-label": "Scroll to evidence " + num }, ["E" + num]);
      a.addEventListener("click", (e) => {
        e.preventDefault();
        const target = document.getElementById("ev-" + num);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      return a;
    }

    function evidenceRefs(ids) {
      const span = el("span", { className: "evidence-refs" });
      if (!ids || !ids.length) return span;
      span.appendChild(document.createTextNode(" ["));
      ids.forEach((id, idx) => {
        const num = String(id).replace(/^E/i, "");
        span.appendChild(evidenceAnchor(num));
        if (idx < ids.length - 1) span.appendChild(document.createTextNode(", "));
      });
      span.appendChild(document.createTextNode("]"));
      return span;
    }

    function renderCited(container, cited) {
      if (!cited || cited.value == null) {
        container.appendChild(document.createTextNode("—"));
        return;
      }
      const text = el("span", { className: "cited-text" }, [String(cited.value)]);
      container.appendChild(text);
      container.appendChild(evidenceRefs(cited.evidence));
    }

    function copyButton(textGetter, label) {
      const btn = el("button", { type: "button" }, ["Copy"]);
      const feedback = el("span", { className: "copy-feedback", "aria-live": "polite" });
      btn.addEventListener("click", async () => {
        const text = textGetter();
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const ta = el("textarea", { "aria-hidden": "true" });
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            if (!ok) throw new Error("copy failed");
          }
          btn.textContent = "Copied";
          feedback.textContent = "Copied to clipboard";
          setTimeout(() => { btn.textContent = "Copy"; feedback.textContent = ""; }, 1500);
        } catch (err) {
          btn.textContent = "Failed";
          feedback.textContent = "Could not copy";
          showError("Could not copy to clipboard.");
          setTimeout(() => { btn.textContent = "Copy"; feedback.textContent = ""; }, 1500);
        }
      });
      return { btn, feedback };
    }

    // =========================================================================
    // API helpers
    // =========================================================================
    async function apiFetch(path, options) {
      const url = path;
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!res.ok) {
        let msg = "Request failed (" + res.status + ")";
        try {
          const body = await res.json();
          msg = body.message || body.error || msg;
        } catch (e) {
          // ignore parse error
        }
        throw new Error(msg);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    function apiGetDossier(workspaceId, leadId) {
      return apiFetch("/api/workspaces/" + encodeURIComponent(workspaceId) + "/leads/" + encodeURIComponent(leadId) + "/dossier");
    }

    function apiGetLeads(workspaceId) {
      return apiFetch("/api/workspaces/" + encodeURIComponent(workspaceId) + "/leads?limit=50&offset=0");
    }

    function apiGetLead(workspaceId, leadId) {
      return apiFetch("/api/workspaces/" + encodeURIComponent(workspaceId) + "/leads/" + encodeURIComponent(leadId));
    }

    function apiGetWorkspaces() {
      return apiFetch("/api/workspaces");
    }

    function apiPatchCallStatus(workspaceId, leadId, callStatus) {
      return apiFetch("/api/workspaces/" + encodeURIComponent(workspaceId) + "/leads/" + encodeURIComponent(leadId) + "/dossier", {
        method: "PATCH",
        body: JSON.stringify({ callStatus })
      });
    }

    function apiPostGenerate(workspaceId, leadId) {
      return apiFetch("/api/workspaces/" + encodeURIComponent(workspaceId) + "/leads/" + encodeURIComponent(leadId) + "/dossier", {
        method: "POST"
      });
    }

    function apiGetReport(token) {
      return apiFetch("/api/report/" + encodeURIComponent(token));
    }

    // =========================================================================
    // Mode dispatch
    // =========================================================================
    let currentView = null;
    let activeWorkspaceName = "";

    async function loadInternalMode(params) {
      const isMock = params.get("mock") === "1";
      const leadId = params.get("lead");
      const workspaceId = isMock ? (params.get("ws") || "ws-mock") : await resolveWorkspaceId(params.get("ws"));
      setPickerVisible(false);
      clearNotice();

      if (!leadId) {
        await renderLeadPicker(workspaceId, isMock);
        return;
      }
      try {
        const data = isMock ? MOCK_LEVEL1 : await apiGetDossier(workspaceId, leadId);
        // UI1: the dossier response has no `lead`; load it from the lead route when needed.
        let lead = data.lead || null;
        if (!lead && !isMock && workspaceId && leadId) {
          try { lead = await apiGetLead(workspaceId, leadId); } catch (e) { lead = null; }
        }
        currentView = {
          mode: "internal",
          workspaceId,
          leadId,
          dossier: data.dossier,
          lead: lead,
          explainer: data.explainer,
          score: data.score,
          verification: data.verification,
          branding: data.branding,
          note: data.note || null
        };
        renderDossierView(currentView);
        if (data.ready === false) renderNotice(data.reason, workspaceId, leadId);
      } catch (err) {
        showError(err.message || "Could not load dossier.");
      }
    }

    function showActiveWorkspace(workspaceId) {
      const node = document.getElementById("active-ws");
      if (!node) return;
      node.textContent = workspaceId ? "Workspace: " + (activeWorkspaceName || workspaceId) : "";
    }

    async function resolveWorkspaceId(paramWs) {
      let list = [];
      try {
        const data = await apiGetWorkspaces();
        list = Array.isArray(data) ? data : (data && data.workspaces) || [];
      } catch (e) { /* list unavailable; ?ws= or the stored key can still win */ }
      const chosen = pickWorkspaceId(paramWs, wsStored(), list);
      if (!chosen) return null;
      wsRemember(chosen);
      const ws = list.find(w => w && w.id === chosen);
      activeWorkspaceName = ws && ws.name ? String(ws.name) : "";
      showActiveWorkspace(chosen);
      return chosen;
    }

    function setPickerVisible(on) {
      setVisible(document.getElementById("id-lead-picker"), on);
    }

    async function renderLeadPicker(workspaceId, isMock) {
      const picker = document.getElementById("id-lead-picker");
      clear(picker);
      setPickerVisible(true);
      picker.appendChild(el("h1", {}, ["Choose a lead"]));
      if (!workspaceId) {
        picker.appendChild(el("p", {}, ["No workspace is selected. Open this page from a lead, or add ?ws=<workspace id> to the address."]));
        return;
      }
      picker.appendChild(el("p", { className: "muted" }, ["Workspace " + workspaceId + ". Pick a lead to open its dossier."]));
      if (isMock) {
        picker.appendChild(el("p", {}, ["Mock mode has no lead list."]));
        return;
      }
      let leads = [];
      try {
        const data = await apiGetLeads(workspaceId);
        leads = (data && data.leads) || [];
      } catch (err) {
        picker.appendChild(el("p", {}, ["Could not load the leads for this workspace. " + (err.message || "")]));
        return;
      }
      if (!leads.length) {
        picker.appendChild(el("p", {}, ["This workspace has no leads yet. Find leads on the main page first."]));
        return;
      }
      const list = el("ul", { className: "picker-list" });
      for (const lead of leads) {
        const li = el("li");
        li.appendChild(el("a", { href: "dossier.html?ws=" + encodeURIComponent(workspaceId) + "&lead=" + encodeURIComponent(lead.id) }, [String(lead.name || lead.id)]));
        const meta = [lead.category, lead.city].filter(Boolean).join(" · ");
        if (meta) li.appendChild(el("span", { className: "muted" }, [" — " + meta]));
        list.appendChild(li);
      }
      picker.appendChild(list);
    }

    function clearNotice() {
      const box = document.getElementById("id-notice");
      if (box) clear(box);
    }

    function renderNotice(reason, workspaceId, leadId) {
      const box = document.getElementById("id-notice");
      clear(box);
      box.appendChild(el("p", {}, [String(reason || "This dossier is not ready yet. Press Process to build it.")]));
      const btn = el("button", { type: "button" }, ["Process"]);
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Processing…";
        try {
          await apiPostGenerate(workspaceId, leadId);
          await loadInternalMode(new URLSearchParams(window.location.search));
        } catch (err) {
          showError(err.message || "Could not process this lead.");
          btn.disabled = false;
          btn.textContent = "Process";
        }
      });
      box.appendChild(btn);
    }

    function renderReportList(report) {
      const nav = document.getElementById("id-report-list");
      clear(nav);
      setVisible(nav, true);
      nav.appendChild(el("h2", {}, ["Dossiers"]));
      if (!report.dossiers || !report.dossiers.length) {
        nav.appendChild(el("p", {}, ["No dossiers in this report."]));
        return;
      }
      for (const dossier of report.dossiers) {
        const lead = dossier.lead || {};
        const item = el("div", { className: "report-item", tabIndex: 0, role: "button", "aria-label": "Open dossier for " + (lead.name || dossier.leadId) });
        const title = el("h3", {}, [String(lead.name || dossier.leadId)]);
        item.appendChild(title);
        if (dossier.gap) {
          item.appendChild(el("span", { className: "tag" }, [String(dossier.gap.tag)]));
          item.appendChild(el("span", { className: "headline" }, [String(dossier.gap.headline.value)]));
        } else {
          item.appendChild(el("span", { className: "headline" }, ["No gap identified"]));
        }
        item.addEventListener("click", () => {
          currentView = {
            mode: "report",
            dossier,
            lead,
            explainer: report.explainers ? report.explainers.find(e => e.id === dossier.explainerId) || null : null,
            score: null,
            verification: null,
            branding: report.branding,
            note: null
          };
          renderDossierView(currentView);
          document.getElementById("id-dossier-view").scrollIntoView({ behavior: "smooth" });
        });
        item.addEventListener("keydown", (e) => { if (e.key === "Enter") item.click(); });
        nav.appendChild(item);
      }
    }

    async function loadReportMode(params) {
      const token = params.get("report") || params.get("token");
      if (!token) {
        showError("Please provide a report token in the URL.");
        return;
      }
      try {
        const report = params.get("mock") === "1" ? MOCK_REPORT : await apiGetReport(token);
        renderReportList(report);
        if (report.dossiers && report.dossiers.length) {
          const dossier = report.dossiers[0];
          const lead = dossier.lead || {};
          currentView = {
            mode: "report",
            dossier,
            lead,
            explainer: report.explainers ? report.explainers.find(e => e.id === dossier.explainerId) || null : null,
            score: null,
            verification: null,
            branding: report.branding,
            note: null
          };
          renderDossierView(currentView);
        }
      } catch (err) {
        showError(err.message || "Could not load report.");
      }
    }

    function init() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("report") || params.get("token")) {
        loadReportMode(params);
        return;
      }
      if (params.get("mock") === "1" && !params.get("ws") && !params.get("lead")) {
        // Backwards-compatible mock default: no parameters means the level 1 sample.
        currentView = {
          mode: "internal",
          workspaceId: "ws-mock",
          leadId: "lead-mock-1",
          dossier: MOCK_LEVEL1.dossier,
          lead: MOCK_LEVEL1.lead,
          explainer: MOCK_LEVEL1.explainer,
          score: MOCK_LEVEL1.score,
          verification: MOCK_LEVEL1.verification,
          branding: MOCK_LEVEL1.branding,
          note: null
        };
        renderDossierView(currentView);
        return;
      }
      // With or without parameters: show the dossier, or a lead picker when no lead is chosen.
      loadInternalMode(params);
    }

    init();
  </script>
</body>
</html>
